<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置 · 小染管理</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="topbar">
  <span class="brand">小染 · 管理</span>
  <nav>
    <a href="/index.html">首页</a>
    <a href="/cards.html">卡密</a>
    <a href="/announce.html">公告</a>
    <a href="/update.html">更新</a>
    <a href="/files.html">文件</a>
    <a href="/cs.html">客服</a>
<a href="/settings.html" class="active">设置</a>
  </nav>
</div>
<div class="wrap">
  <h1 class="page">全局设置</h1>
  <p class="sub">一键关闭软件后，前端将无法使用；导入路径供前端注入时读取。</p>

  <div class="card">
    <h2>软件开关</h2>
    <p id="swState" class="msg" style="margin-top:0"></p>
    <button class="btn danger" id="btnOff" onclick="setOff(true)">一键关闭软件</button>
    <button class="btn ghost" id="btnOn" onclick="setOff(false)">开启软件</button>
  </div>

  <div class="card">
    <h2>文件导入路径</h2>
    <label>默认导入 路径</label><input id="pDef" type="text" placeholder="/sdcard/mikasa/inject/default">
    <label>pak 导入 路径</label><input id="pPak" type="text" placeholder="/sdcard/mikasa/inject/pak">
    <button class="btn" onclick="savePaths()">保存导入路径</button>
  </div>

  <div class="msg" id="m">就绪</div>
</div>
<script src="/js/api.js"></script>
<script>
async function load() {
  const s = await req("GET", "/api/settings");
  document.getElementById("pDef").value = s.importPathDefault || "";
  document.getElementById("pPak").value = s.importPathPak || "";
  const off = !s.softwareEnabled;
  document.getElementById("btnOff").disabled = off;
  document.getElementById("btnOn").disabled = !off;
  document.getElementById("swState").textContent = off ? "软件已关闭（前端不可用）" : "软件运行中";
  document.getElementById("swState").className = "msg " + (off ? "err" : "ok");
}
async function setOff(off) {
  await req("PUT", "/api/settings", { softwareEnabled: !off });
  msg(document.getElementById("m"), off ? "已一键关闭软件" : "已开启软件", true);
  load();
}
async function savePaths() {
  await req("PUT", "/api/settings", {
    importPathDefault: document.getElementById("pDef").value,
    importPathPak: document.getElementById("pPak").value
  });
  msg(document.getElementById("m"), "导入路径已保存", true);
}
load();
</script>
</body>
</html>
