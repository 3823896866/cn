<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>更新 · 小染管理</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="topbar">
  <span class="brand">小染 · 管理</span>
  <nav>
    <a href="/index.html">首页</a>
    <a href="/cards.html">卡密</a>
    <a href="/announce.html">公告</a>
    <a href="/update.html" class="active">更新</a>
    <a href="/files.html">文件</a>
    <a href="/cs.html">客服</a>
<a href="/settings.html">设置</a>
  </nav>
</div>
<div class="wrap">
  <h1 class="page">软件更新</h1>
  <p class="sub">图标 / 版本 / 下载链接 / 内容。保存后前端「关于」页会展示。</p>

  <div class="card">
    <h2>更新信息</h2>
    <div class="row">
      <div><label>软件版本</label><input id="version" type="text" placeholder="v1.2.0"></div>
      <div><label>下载链接</label><input id="url" type="text" placeholder="https://..."></div>
    </div>
    <label>图标（可选，上传后展示）</label>
    <input id="icon" type="file" accept="image/*"><img id="iconPrev" class="preview" style="display:none">
    <label>更新内容</label><textarea id="content" placeholder="本次更新说明"></textarea>
    <button class="btn" onclick="save()">保存更新</button>
  </div>
  <div class="msg" id="m">就绪</div>
</div>
<script src="/js/api.js"></script>
<script>
let iconB64 = "";
document.getElementById("icon").addEventListener("change", async (e) => {
  const f = e.target.files[0];
  if (!f) { iconB64 = ""; document.getElementById("iconPrev").style.display = "none"; return; }
  iconB64 = await fileToB64(f);
  const p = document.getElementById("iconPrev"); p.src = "data:image/png;base64," + iconB64; p.style.display = "block";
});
async function save() {
  try {
    const cur = await req("GET", "/api/update");
    await req("PUT", "/api/update", {
      version: document.getElementById("version").value,
      downloadUrl: document.getElementById("url").value,
      content: document.getElementById("content").value,
      icon: iconB64 ? "data:image/png;base64," + iconB64 : cur.icon
    });
    msg(document.getElementById("m"), "已保存", true);
  } catch (e) { msg(document.getElementById("m"), e.message, false); }
}
(async () => {
  const u = await req("GET", "/api/update");
  document.getElementById("version").value = u.version || "";
  document.getElementById("url").value = u.downloadUrl || "";
  document.getElementById("content").value = u.content || "";
})();
</script>
</body>
</html>
