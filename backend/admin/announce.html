<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>公告 · 小染管理</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="topbar">
  <span class="brand">小染 · 管理</span>
  <nav>
    <a href="/index.html">首页</a>
    <a href="/cards.html">卡密</a>
    <a href="/announce.html" class="active">公告</a>
    <a href="/update.html">更新</a>
    <a href="/files.html">文件</a>
    <a href="/cs.html">客服</a>
<a href="/settings.html">设置</a>
  </nav>
</div>
<div class="wrap">
  <h1 class="page">公告管理</h1>
  <p class="sub">主标题 + 内容 + 上传图片。</p>

  <div class="card">
    <h2>新建公告</h2>
    <label>主标题</label><input id="title" type="text" placeholder="公告标题">
    <label>内容</label><textarea id="content" placeholder="公告正文"></textarea>
    <label>配图（可选，JPG/PNG）</label><input id="img" type="file" accept="image/*">
    <img id="preview" class="preview" style="display:none">
    <button class="btn" onclick="create()">发布公告</button>
  </div>

  <div class="card">
    <h2>公告列表</h2>
    <div id="list"></div>
  </div>
  <div class="msg" id="m">就绪</div>
</div>
<script src="/js/api.js"></script>
<script>
let imgB64 = "";
document.getElementById("img").addEventListener("change", async (e) => {
  const f = e.target.files[0];
  if (!f) { imgB64 = ""; document.getElementById("preview").style.display = "none"; return; }
  imgB64 = await fileToB64(f);
  const p = document.getElementById("preview");
  p.src = "data:image/png;base64," + imgB64; p.style.display = "block";
});
async function create() {
  try {
    await req("POST", "/api/announcements", {
      title: document.getElementById("title").value,
      content: document.getElementById("content").value,
      image: imgB64 ? "data:image/png;base64," + imgB64 : ""
    });
    msg(document.getElementById("m"), "已发布", true);
    document.getElementById("title").value = ""; document.getElementById("content").value = "";
    document.getElementById("img").value = ""; imgB64 = "";
    document.getElementById("preview").style.display = "none";
    load();
  } catch (e) { msg(document.getElementById("m"), e.message, false); }
}
async function del(id) { if (confirm("删除该公告？")) { await req("DELETE", `/api/announcements/${id}`); load(); } }
async function load() {
  const rows = await req("GET", "/api/announcements");
  document.getElementById("list").innerHTML = rows.map(a => `
    <div class="card" style="padding:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <strong>${esc(a.title)}</strong>
        <button class="btn small danger" onclick="del(${a.id})">删除</button>
      </div>
      <p style="margin-top:6px">${esc(a.content)}</p>
      ${a.image ? `<img class="preview" src="/uploads/${encodeURIComponent(a.image)}">` : ""}
      <p class="muted" style="margin-top:6px;font-size:12px">创建于 ${esc(a.createdAt)}</p>
    </div>`).join("") || '<p class="muted">暂无公告</p>';
}
load();
</script>
</body>
</html>
