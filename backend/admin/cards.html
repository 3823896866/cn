<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>卡密 · 小染管理</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="topbar">
  <span class="brand">小染 · 管理</span>
  <nav>
    <a href="/index.html">首页</a>
    <a href="/cards.html" class="active">卡密</a>
    <a href="/announce.html">公告</a>
    <a href="/update.html">更新</a>
    <a href="/files.html">文件</a>
    <a href="/cs.html">客服</a>
<a href="/settings.html">设置</a>
  </nav>
</div>
<div class="wrap">
  <h1 class="page">卡密管理</h1>
  <p class="sub">生成 / 删除 / 封禁 / 解封；查看生成时间与使用时间。</p>

  <div class="card">
    <h2>生成卡密</h2>
    <div class="row">
      <div><label>长度</label><input id="len" type="number" value="16" min="4" max="64"></div>
      <div><label>格式</label>
        <select id="fmt">
          <option>字母数字</option><option>大小写字母</option><option>数字</option><option>含特殊字符</option>
        </select>
      </div>
      <div><label>数量</label><input id="cnt" type="number" value="1" min="1" max="50"></div>
    </div>
    <button class="btn" onclick="gen()">生成卡密</button>
  </div>

  <div class="card">
    <h2>卡密列表</h2>
    <div class="tablewrap">
      <table>
        <thead><tr><th>卡密</th><th>格式</th><th>状态</th><th>生成时间</th><th>使用时间</th><th>操作</th></tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </div>
  <div class="msg" id="m">就绪</div>
</div>
<script src="/js/api.js"></script>
<script>
async function gen() {
  try {
    await req("POST", "/api/cards/generate", {
      length: document.getElementById("len").value,
      format: document.getElementById("fmt").value,
      count: document.getElementById("cnt").value
    });
    msg(document.getElementById("m"), "生成成功", true); load();
  } catch (e) { msg(document.getElementById("m"), e.message, false); }
}
async function act(id, method) {
  await req("POST", `/api/cards/${id}/${method}`); load();
}
async function del(id) { if (confirm("删除该卡密？")) { await req("DELETE", `/api/cards/${id}`); load(); } }
async function load() {
  const rows = await req("GET", "/api/cards");
  document.getElementById("tb").innerHTML = rows.map(r => `
    <tr>
      <td><code>${esc(r.code)}</code></td>
      <td>${esc(r.format)}</td>
      <td><span class="tag ${r.banned ? 'no' : 'ok'}">${r.banned ? '已封禁' : '正常'}</span></td>
      <td>${esc(r.createdAt)}</td>
      <td>${r.usedAt ? esc(r.usedAt) : '<span class="muted">未使用</span>'}</td>
      <td>
        ${r.banned ? `<button class="btn small ghost" onclick="act(${r.id},'unban')">解封</button>`
                   : `<button class="btn small ghost" onclick="act(${r.id},'ban')">封禁</button>`}
        <button class="btn small danger" onclick="del(${r.id})">删除</button>
      </td>
    </tr>`).join("") || '<tr><td colspan="6" class="muted">暂无卡密</td></tr>';
}
load();
</script>
</body>
</html>
