plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.xiaoran.nb'
    compileSdk 34

    defaultConfig {
        applicationId "com.xiaoran.nb"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "6.1"
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.10'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'

    // Compose UI（Material3 启动器页面）—— 升到 2024.12.01（匹配 backdrop 2.0.1 所需的较新 Compose）
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // 视频背景（Compose 承载 ExoPlayer，使液态玻璃可折射视频帧）
    def media3 = '1.3.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-ui:$media3"

    // ★ 液态玻璃（Apple 风格）库 - Kyant0/Backdrop（GitHub 原版开源，Apache-2.0）
    // 使用纯 Android 专用构件 backdrop-android；版本已在 Maven Central 核实存在。
    // 若日后升级，把 2.0.1 换成 io/github/kyant0/backdrop-android/ 下的最新 tag 即可。
    implementation "io.github.kyant0:backdrop-android:2.0.1"
}
