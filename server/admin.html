<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小染注入后端</title>
<style>
:root{--b:#1e5fd6;--bl:#e8f0fe;--bg:#f2f5fb;--card:#fff;--line:#dbe3f0;--tx:#1f2a44;--sub:#7a869c;--ok:#12a150;--bad:#e5484d}
*{box-sizing:border-box;margin:0}body{font:14px/1.55 system-ui,-apple-system,"Noto Sans",sans-serif;color:var(--tx);background:var(--bg)}
#side{position:fixed;left:0;top:0;bottom:0;width:210px;background:var(--b);color:#fff;padding:14px 0}
#side .logo{font-size:16px;font-weight:700;padding:6px 18px 14px;border-bottom:1px solid rgba(255,255,255,.18)}
#side a{display:block;padding:10px 18px;color:#dce9ff;cursor:pointer;font-size:14px}
#side a.on{background:rgba(255,255,255,.16);color:#fff;border-left:3px solid #fff}
#main{margin-left:210px;padding:16px}
h1{font-size:18px;margin:6px 0}
.sec{display:none}.sec.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{background:var(--b);color:#fff;border:0;border-radius:7px;padding:8px 14px;cursor:pointer}
button.ghost{background:var(--bl);color:var(--b)}button.bad{background:var(--bad)}button.ok{background:var(--ok)}
input,textarea,select{background:#fff;border:1px solid var(--line);border-radius:7px;padding:8px;font:inherit;color:var(--tx)}
label{color:var(--sub);font-size:12px;display:block;margin:8px 0 3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.stat{background:var(--bl);border-radius:10px;padding:14px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--b)}
.list{max-height:260px;overflow:auto}.it{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:6px 0;flex-wrap:wrap}
.pill{padding:2px 8px;border-radius:10px;background:var(--bl);color:var(--b);font-size:11px}
.pill.b{background:#fdecec;color:var(--bad)}
#login{max-width:340px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px}
#top{background:var(--b);color:#fff;padding:10px 16px;border-radius:8px;margin-bottom:12px;font-size:13px}
.msg{color:var(--sub);font-size:12px;margin-top:6px;white-space:pre-wrap}
</style></head><body>
<div id="side"><div class="logo">小染注入后端</div>
<a data-t="ov" class="on">概览</a><a data-t="card">卡密</a><a data-t="ann">公告</a>
<a data-t="upd">更新</a><a data-t="vid">视频背景</a><a data-t="file">文件</a>
<a data-t="mus">音乐</a><a data-t="cs">客服</a><a data-t="dir">目录</a></div>
<div id="main">
<div id="login"><h1>管理员登录</h1><label>管理员 Key</label><input id="adm" placeholder="小染nb2026"><div class="row" style="margin-top:10px"><button onclick="login()">进入面板</button></div><div class="msg" id="lmsg"></div></div>
<div id="app" style="display:none">
<div id="top">小染注入后端 · 控制台　<a style="float:right;color:#cfe0ff;cursor:pointer" onclick="logout()">退出</a></div>
<div class="sec on" data-t="ov"><h1>概览</h1>
<div class="grid"><div class="stat"><b id="ovOnline">-</b>在线人数</div><div class="stat"><b id="ovTotal">-</b>使用人数</div></div>
<div class="card">服务状态：<span id="ovSvc"></span>　<button class="bad" onclick="setDis(true)">一键停用</button> <button class="ok" onclick="setDis(false)">恢复</button></div>
</div>
<div class="sec" data-t="card"><h1>卡密</h1>
<div class="card"><b>生成卡密</b>
<div class="row" style="margin-top:8px">
<select id="cDur"><option value="permanent">永久</option><option value="month">月卡</option><option value="week">周卡</option><option value="day">天卡</option></select>
<select id="cFmt"><option value="alnum">字母+数字</option><option value="digits">纯数字</option><option value="letters">纯字母</option><option value="custom">自定义前缀</option></select>
<select id="cCase"><option value="1">大小写</option><option value="0">小写</option></select>
<input id="cPre" placeholder="前缀(custom)" style="width:90px"><input id="cLen" placeholder="长度" value="6" style="width:60px">
<button onclick="genCard()">生成</button></div>
<div class="row" style="margin-top:6px"><input id="banKey" placeholder="要封禁/解封的卡密" style="max-width:220px"><input id="banReason" placeholder="封禁原因" style="max-width:180px"><button class="bad" onclick="ban(true)">封禁</button><button class="ghost" onclick="ban(false)">解封</button><button class="bad" onclick="delCard()">删除</button></div>
</div>
<div class="card"><b>卡密列表</b><div class="row" style="margin-top:6px"><button class="ghost" onclick="loadCards()">刷新</button></div><div class="list" id="cards"></div></div>
</div>
<div class="sec" data-t="ann"><h1>公告</h1>
<div class="card"><label>主标题</label><input id="anT" style="width:100%">
<label>内容</label><textarea id="anC" rows="3" style="width:100%"></textarea>
<label>图标（上传）</label><div class="row"><input type="file" id="anI" accept="image/*" style="display:none"><button class="ghost" onclick="document.getElementById('anI').click()">上传图标</button><span class="msg" id="anIv">无</span><input type="hidden" id="anIb"></div>
<div class="row" style="margin-top:8px"><button onclick="saveAnn()">保存公告</button></div></div>
</div>
<div class="sec" data-t="upd"><h1>更新</h1>
<div class="card"><label>更新内容（changelog）</label><textarea id="uContent" rows="3" style="width:100%"></textarea>
<label>更新图片（上传）</label><div class="row"><input type="file" id="uImg" accept="image/*" style="display:none"><button class="ghost" onclick="document.getElementById('uImg').click()">上传图片</button><span class="msg" id="uImgv">无</span><input type="hidden" id="uImgb"></div>
<div class="row" style="margin-top:8px"><div style="flex:1"><label>最低版本</label><input id="uMin"></div><div style="flex:2"><label>下载链接</label><input id="uUrl"></div></div>
<div class="row" style="margin-top:8px"><label style="display:inline">启用<input type="checkbox" id="uEn" style="width:auto"></label><label style="display:inline;margin-left:14px">强制更新<input type="checkbox" id="uForce" style="width:auto"></label><button onclick="saveUpd()">保存更新</button></div></div>
</div>
<div class="sec" data-t="vid"><h1>视频背景</h1>
<div class="card"><label>上传视频（本地文件，非链接）</label>
<div class="row"><input type="file" id="vFile" accept="video/*" style="display:none"><button class="ghost" onclick="document.getElementById('vFile').click()">选择视频</button><button onclick="upVideo()">上传为视频背景</button></div>
<div class="msg" id="vNote">已上传后可在前端小染页「开启视频背景」生效（播放 /videoBg）。</div></div>
</div>
<div class="sec" data-t="file"><h1>文件</h1>
<div class="card"><div class="row"><input type="file" id="fFile" multiple style="display:none"><button class="ghost" onclick="document.getElementById('fFile').click()">上传文件</button><button class="ghost" onclick="loadFiles()">刷新</button></div><div class="list" id="files"></div></div></div>
<div class="sec" data-t="mus"><h1>音乐</h1>
<div class="card"><div class="row"><input type="file" id="mFile" accept="audio/*" multiple style="display:none"><button class="ghost" onclick="document.getElementById('mFile').click()">上传音乐</button><button class="ghost" onclick="loadFiles()">刷新</button></div><div class="list" id="music"></div></div></div>
<div class="sec" data-t="cs"><h1>客服</h1>
<div class="card"><b>问答（前端会显示问题）</b>
<div class="row" style="margin-top:8px"><input id="csQ" placeholder="问题" style="flex:1"><input id="csA" placeholder="回答" style="flex:1"><button onclick="csAdd()">添加</button></div>
<div class="list" id="csQa"></div></div>
<div class="card"><b>留言收件箱（标注卡密 + 设备）</b>
<div class="row" style="margin-top:6px"><button class="ghost" onclick="loadInbox()">刷新</button></div><div class="list" id="inbox"></div></div>
</div>
<div class="sec" data-t="dir"><h1>zip 解压目标</h1>
<div class="card"><label>默认目录（default）</label><div class="row"><input id="dDef"><button class="ghost" onclick="saveDir('default')">保存</button></div>
<label>pak 目录</label><div class="row"><input id="dPak"><button class="ghost" onclick="saveDir('pak')">保存</button></div>
<div class="msg">前端解压时按所选「默认 / pak」导入到对应目录。</div></div>
</div>
</div></div>
<script>
const B = location.origin;
const $ = id => document.getElementById(id);
const key = () => localStorage.getItem('xr_admin') || '';
function api(p, m, o) {
  const opt = { method: m || 'GET', headers: {} };
  if (key()) opt.headers['x-admin'] = key();
  if (m && m !== 'GET' && o) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(o); }
  return fetch(B + p, opt).then(r => r.json());
}
function login() { localStorage.setItem('xr_admin', $('adm').value.trim()); enter(); }
function logout() { localStorage.removeItem('xr_admin'); location.reload(); }
function enter() {
  if (!key()) { $('lmsg').textContent = '请输入 Key'; return; }
  api('/api/stats').then(() => { $('login').style.display = 'none'; $('app').style.display = ''; show('ov'); refresh(); });
}
function refresh() {
  api('/api/status').then(s => { $('ovSvc').textContent = s.serviceDisabled ? '已停用' : '运行中'; $('ovTotal').textContent = s.total || 0; });
  api('/api/stats').then(s => { $('ovOnline').textContent = s.online; });
  loadCards(); loadFiles(); loadQa(); loadInbox(); loadCfg();
}
function show(t) {
  document.querySelectorAll('.sec').forEach(x => x.classList.toggle('on', x.dataset.t === t));
  document.querySelectorAll('#side a').forEach(a => a.classList.toggle('on', a.dataset.t === t));
}
document.querySelectorAll('#side a').forEach(a => a.onclick = () => show(a.dataset.t));
function setDis(on) { api('/api/admin/disable', 'POST', { on }).then(refresh); }
// 卡密
function genCard() {
  api('/api/admin/generateCard', 'POST', { dur: $('cDur').value, format: $('cFmt').value, prefix: $('cPre').value, len: +$('cLen').value, upper: $('cCase').value === '1', label: '' })
    .then(r => { if (r.key) { alert('已生成卡密：' + r.key); loadCards(); } else alert(r.msg || '失败'); });
}
function ban(b) { const k = $('banKey').value.trim(); if (!k) return; api('/api/admin/banCard', 'POST', { key: k, ban: b, reason: $('banReason').value }).then(loadCards); }
function delCard() { const k = $('banKey').value.trim(); if (!k) return; if (!confirm('删除卡密 ' + k + '？')) return; api('/api/admin/deleteCard', 'POST', { key: k }).then(loadCards); }
function loadCards() { api('/api/admin/cards').then(r => { const box = $('cards'); const cs = r.cards || {}; const ks = Object.keys(cs); box.innerHTML = ks.length ? '' : '<div class="sub">暂无卡密</div>';
  for (const k of ks) { const c = cs[k]; const st = c.banned ? '<span class="pill b">封禁:' + (c.banReason || '无理由') + '</span>' : '<span class="pill">' + (c.boundDevice ? '已绑:' + c.boundDevice : '可用') + '</span>';
    const ex = c.expiresAt ? '·' + (c.type === 'permanent' ? '永久' : new Date(c.expiresAt).toLocaleDateString()) : '';
    box.innerHTML += '<div class="it"><span>' + k + ' <span class="pill">' + c.type + ex + '</span> ' + st + '</span><span><button class="ghost" style="padding:2px 8px" onclick="banto(\'' + k + '\')">封禁</button> <button class="ghost" style="padding:2px 8px" onclick="banoff(\'' + k + '\')">解封</button> <button class="bad" style="padding:2px 8px" onclick="delone(\'' + k + '\')">删除</button></span></div>'; } }); }
function banto(k) { $('banKey').value = k; const r = prompt('封禁原因：', ''); if (r === null) return; api('/api/admin/banCard', 'POST', { key: k, ban: true, reason: r || '未填写' }).then(loadCards); }
function banoff(k) { api('/api/admin/banCard', 'POST', { key: k, ban: false }).then(loadCards); }
function delone(k) { if (!confirm('删除 ' + k + '？')) return; api('/api/admin/deleteCard', 'POST', { key: k }).then(loadCards); }
// 公告 / 更新 / 视频 / 目录
function ftoB(el, span) { const f = el.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { el.value = ''; span.textContent = f.name + ' ✓'; }; r.readAsDataURL(f); return r.result; }
function loadAnnCfg() { api('/api/status').then(s => { const a = s.announcement || {}; $('anT').value = a.title || ''; $('anC').value = a.content || ''; const u = s.update || {}; $('uMin').value = u.minVersion || ''; $('uUrl').value = u.url || ''; $('uEn').checked = !!u.enabled; $('uForce').checked = !!u.force; $('uContent').value = u.content || ''; }); }
function saveAnn() { let ic = ''; const f = $('anI').files[0]; if (f) { const r = new FileReader(); r.onload = () => { ic = r.result; doAnn(ic); }; r.readAsDataURL(f); return; } doAnn(''); }
function doAnn(ic) { api('/api/admin/announce', 'POST', { title: $('anT').value, content: $('anC').value, icon: ic }).then(() => alert('公告已保存')); }
function saveUpd() { let img = ''; const f = $('uImg').files[0]; const go = () => api('/api/admin/update', 'POST', { minVersion: $('uMin').value, url: $('uUrl').value, enabled: $('uEn').checked, force: $('uForce').checked, content: $('uContent').value, image: img }).then(() => alert('更新已保存')); if (f) { const r = new FileReader(); r.onload = () => { img = r.result; go(); }; r.readAsDataURL(f); } else go(); }
function upVideo() { const f = $('vFile').files[0]; if (!f) { alert('请先选择视频'); return; } const r = new FileReader(); r.onload = () => api('/api/admin/uploadVideo', 'POST', { contentBase64: r.result.split(',')[1] }).then(x => $('vNote').textContent = x.ok ? '视频已上传（/videoBg）' : '失败'); r.readAsDataURL(f); }
function saveDir(w) { api('/api/admin/setImportDir', 'POST', { which: w, path: w === 'pak' ? $('dPak').value : $('dDef').value }).then(() => alert('已保存')); }
function loadCfg() { api('/api/config').then(c => { $('dDef').value = (c.importDir && c.importDir.default) || ''; $('dPak').value = (c.importDir && c.importDir.pak) || ''; }); }
// 文件 / 音乐（分开）
function upload(kind) { const el = $(kind === 'files' ? 'fFile' : 'mFile'); [...el.files].forEach(f => { const r = new FileReader(); r.onload = () => api('/api/' + (kind === 'files' ? 'file' : 'music') + '/upload', 'POST', { name: f.name, contentBase64: r.result.split(',')[1] }).then(loadFiles); r.readAsDataURL(f); }); el.value = ''; }
function loadFiles() { Promise.all([api('/api/files'), api('/api/music')]).then(([f, m]) => {
  $('files').innerHTML = f.files.map(x => '<div class="it"><span>' + x.name + ' <span class="pill">' + (x.size / 1024).toFixed(0) + 'KB</span></span><a href="' + B + x.url + '" target="_blank" style="color:var(--b)">下载</a></div>').join('') || '<div class="sub">无</div>';
  $('music').innerHTML = m.files.map(x => '<div class="it"><span>♪ ' + x.name + ' <span class="pill">' + (x.size / 1024).toFixed(0) + 'KB</span></span><a href="' + B + x.url + '" target="_blank" style="color:var(--b)">试听/下载</a></div>').join('') || '<div class="sub">无</div>'; }); }
// 客服
function csAdd() { api('/api/admin/csQa', 'POST', { q: $('csQ').value, a: $('csA').value }).then(loadQa); }
function loadQa() { api('/api/csQa').then(r => $('csQa').innerHTML = (r.qa || []).map(x => '<div class="it"><span>Q:' + x.q + '</span><span>A:' + x.a + ' <button class="ghost" style="padding:2px 8px" onclick="delQa(\'' + x.id + '\')">删</button></span></div>').join('') || '<div class="sub">无</div>')); }
function delQa(id) { api('/api/admin/csQa', 'POST', { del: id }).then(loadQa); }
function loadInbox() { api('/api/admin/csInbox').then(r => $('inbox').innerHTML = (r.inbox || []).map(x => '<div class="it"><span>[' + new Date(x.ts).toLocaleString() + '] <span class="pill">' + (x.card || '未知卡密') + '</span> 设备:' + (x.device || '?') + '</span><span>' + (x.text || '') + (x.media ? ' [含媒体]' : '') + '</span></div>').join('') || '<div class="sub">暂无留言</div>')); }
// 启动
if (key()) enter();
setInterval(() => { api('/api/stats').then(s => $('ovOnline').textContent = s.online); }, 30000);
</script></body></html>
