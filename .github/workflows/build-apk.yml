name: Build 小染自动注入 APK
on:
  push:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        run: |
          SdkRoot="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SdkRoot"; export ANDROID_SDK_ROOT="$SdkRoot"
          SM=""
          for c in latest 16.0 15.0 14.0; do
            if [ -x "$SdkRoot/cmdline-tools/$c/bin/sdkmanager" ]; then SM="$SdkRoot/cmdline-tools/$c/bin/sdkmanager"; break; fi
          done
          if [ -z "$SM" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/clt.zip
            python3 -c "import zipfile;zipfile.ZipFile('/tmp/clt.zip').extractall('/tmp/clt')"
            mkdir -p "$SdkRoot/cmdline-tools" && mv /tmp/clt/cmdline-tools "$SdkRoot/cmdline-tools/latest"
            SM="$SdkRoot/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SdkRoot" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SdkRoot" >> "$GITHUB_ENV"
          echo "$SdkRoot/platform-tools" >> "$GITHUB_PATH"
      - name: local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties
      - name: Assemble debug APK
        run: sh ./gradlew :app:assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx3072m"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 小染自动注入-debug
          path: app/build/outputs/apk/debug/*.apk
