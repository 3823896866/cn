name: 打包 小染 APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Android SDK 34
        run: |
          SM="$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SM" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/ct.zip
            unzip -q /tmp/ct.zip -d "$HOME/android-sdk"
            mv "$HOME/android-sdk/cmdline-tools" "$HOME/android-sdk/latest"
            mkdir -p "$HOME/android-sdk/cmdline-tools"
            mv "$HOME/android-sdk/latest" "$HOME/android-sdk/cmdline-tools/latest"
          fi
          yes | "$SM" --licenses || true
          "$SM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties

      - name: 构建
        run: sh ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 小染自动注入-debug
          path: app/build/outputs/apk/debug/*.apk
