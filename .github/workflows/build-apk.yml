name: Build 小染自动注入 APK
on:
  push:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK + NDK 27.1
        uses: android-actions/setup-android@v3
        with:
          ndk-version: "27.1.12297006"
          build-tools: "34.0.0"
          platform-version: "34"

      - name: Accept licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      # 交叉编译 FreeType(aarch64) 供 CMake 链接；失败则 CMake 自动回退内置字体，仍可出包
      - name: Build FreeType .a (best-effort)
        run: |
          NDK="$ANDROID_HOME/ndk/27.1.12297006"
          [ -d "$NDK" ] || NDK="${ANDROID_NDK:-$NDK}"
          if [ -d "$NDK" ]; then
            bash app/src/main/cpp/freetype/build_freetype_aarch64.sh "$NDK" || echo "freetype 编译失败 -> 回退内置字体"
          fi
          ls -la app/src/main/cpp/freetype/libfreetype.a 2>/dev/null || echo "(无 freetype .a，用内置字体)"

      - name: local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx3072m"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 小染自动注入-debug
          path: app/build/outputs/apk/debug/*.apk
